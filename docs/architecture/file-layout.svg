<g class="purple"><rect x="250" y="780" width="180" height="44" rx="4"/><text class="th" x="340" y="799" text-anchor="middle">arch/architecture.h</text><text class="ts" x="340" y="815" text-anchor="middle">what an arch supplies</text></g>
