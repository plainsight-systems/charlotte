<svg xmlns="http://www.w3.org/2000/svg" width="680" height="883" viewBox="0 0 680 883" role="img">
<title>File layout and boundaries</title>
<desc>Three layers: JavaScript files in web/, the boundary between worker.js and bindings.cpp, and the C++ core in src/core/, whose modules each change on one axis and depend on a band of contract headers. Modules that hold GPU objects have dashed borders.</desc>
<style>
  .th { font: 500 14px -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; fill: #2C2C2A; }
  .ts { font: 400 12px -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; fill: #5F5E5A; }
  .bg { fill: #FFFFFF; }
  .frame { fill: none; stroke: #B4B2A9; stroke-width: 1; stroke-dasharray: 4 4; }
  rect { stroke-width: 1; }
  .gray rect   { fill: #F1EFE8; stroke: #888780; } .gray .th   { fill: #2C2C2A; } .gray .ts   { fill: #5F5E5A; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; } .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .coral rect  { fill: #FAECE7; stroke: #D85A30; } .coral .th  { fill: #712B13; } .coral .ts  { fill: #993C1D; }
  .gpu rect { stroke-dasharray: 4 3; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="883"/>
<rect class="frame" x="40" y="20" width="600" height="190" rx="8"/>
<text class="th" x="56" y="40">web/ — JavaScript</text>
<g class="gray"><rect x="52" y="52" width="180" height="44" rx="4"/><text class="th" x="142" y="71" text-anchor="middle">picker.js</text><text class="ts" x="142" y="87" text-anchor="middle">H · choose a model</text></g>
<g class="gray"><rect x="250" y="52" width="180" height="44" rx="4"/><text class="th" x="340" y="71" text-anchor="middle">models.json</text><text class="ts" x="340" y="87" text-anchor="middle">J · measured policy</text></g>
<g class="gray"><rect x="448" y="52" width="180" height="44" rx="4"/><text class="th" x="538" y="71" text-anchor="middle">template.js</text><text class="ts" x="538" y="87" text-anchor="middle">H · render chat template</text></g>
<g class="gray"><rect x="52" y="104" width="180" height="44" rx="4"/><text class="th" x="142" y="123" text-anchor="middle">chat.js</text><text class="ts" x="142" y="139" text-anchor="middle">H · conversation, streaming</text></g>
<g class="gray"><rect x="250" y="104" width="180" height="44" rx="4"/><text class="th" x="340" y="123" text-anchor="middle">fetch.js</text><text class="ts" x="340" y="139" text-anchor="middle">L · range and stream</text></g>
<g class="gray"><rect x="448" y="104" width="180" height="44" rx="4"/><text class="th" x="538" y="123" text-anchor="middle">opfs.js</text><text class="ts" x="538" y="139" text-anchor="middle">L · model file cache</text></g>
<g class="gray"><rect x="52" y="156" width="180" height="44" rx="4"/><text class="th" x="142" y="175" text-anchor="middle">load.js</text><text class="ts" x="142" y="191" text-anchor="middle">L · chunks to the runtime</text></g>
<g class="gray"><rect x="250" y="156" width="180" height="44" rx="4"/><text class="th" x="340" y="175" text-anchor="middle">duplicates.js</text><text class="ts" x="340" y="191" text-anchor="middle">L · confirm copies in the cache</text></g>
<line class="arr" x1="340" y1="210" x2="340" y2="230" marker-end="url(#a)"/>
<g class="coral"><rect x="40" y="232" width="600" height="52" rx="4"/><text class="th" x="340" y="251" text-anchor="middle">The boundary: worker.js ⇄ bindings.cpp</text><text class="ts" x="340" y="267" text-anchor="middle">preflight · load: begin, chunk, finish · generate · cancel</text></g>
<line class="arr" x1="340" y1="284" x2="340" y2="304" marker-end="url(#a)"/>
<rect class="frame" x="40" y="306" width="600" height="312" rx="8"/>
<text class="th" x="56" y="326">src/core/ — C++, builds and tests natively</text>
<g class="gray"><rect x="52" y="338" width="104" height="44" rx="4"/><text class="th" x="104" y="357" text-anchor="middle">gguf/</text><text class="ts" x="104" y="373" text-anchor="middle">C · reader</text></g>
<g class="gray"><rect x="170" y="338" width="104" height="44" rx="4"/><text class="th" x="222" y="357" text-anchor="middle">capability/</text><text class="ts" x="222" y="373" text-anchor="middle">I · one table</text></g>
<g class="gray"><rect x="288" y="338" width="104" height="44" rx="4"/><text class="th" x="340" y="357" text-anchor="middle">preflight/</text><text class="ts" x="340" y="373" text-anchor="middle">I · four gates</text></g>
<g class="gray"><rect x="406" y="338" width="104" height="44" rx="4"/><text class="th" x="458" y="357" text-anchor="middle">arch/*</text><text class="ts" x="458" y="373" text-anchor="middle">A · per arch</text></g>
<g class="gray"><rect x="524" y="338" width="104" height="44" rx="4"/><text class="th" x="576" y="357" text-anchor="middle">formats/*</text><text class="ts" x="576" y="373" text-anchor="middle">B · device layout</text></g>
<g class="gray"><rect x="52" y="394" width="180" height="44" rx="4"/><text class="th" x="142" y="413" text-anchor="middle">residency/plan</text><text class="ts" x="142" y="429" text-anchor="middle">D · pure, no GPU</text></g>
<g class="gray"><rect x="250" y="394" width="180" height="44" rx="4"/><text class="th" x="340" y="413" text-anchor="middle">residency/routes</text><text class="ts" x="340" y="429" text-anchor="middle">D · pure, file to buffers</text></g>
<g class="gray"><rect x="448" y="394" width="180" height="44" rx="4"/><text class="th" x="538" y="413" text-anchor="middle">residency/piece_writer</text><text class="ts" x="538" y="429" text-anchor="middle">D · pure, chunks to writes</text></g>
<g class="gray gpu"><rect x="52" y="450" width="180" height="44" rx="4"/><text class="th" x="142" y="469" text-anchor="middle">residency/upload</text><text class="ts" x="142" y="485" text-anchor="middle">D · owns every buffer</text></g>
<g class="gray gpu"><rect x="250" y="450" width="180" height="44" rx="4"/><text class="th" x="340" y="469" text-anchor="middle">residency/upload_check</text><text class="ts" x="340" y="485" text-anchor="middle">D · diagnostic readback</text></g>
<g class="gray gpu"><rect x="448" y="450" width="180" height="44" rx="4"/><text class="th" x="538" y="469" text-anchor="middle">gpu/</text><text class="ts" x="538" y="485" text-anchor="middle">D · device, dispatch</text></g>
<g class="gray"><rect x="52" y="506" width="135" height="44" rx="4"/><text class="th" x="119.5" y="525" text-anchor="middle">tokenizer/*</text><text class="ts" x="119.5" y="541" text-anchor="middle">K · per algorithm</text></g>
<g class="gray"><rect x="199" y="506" width="135" height="44" rx="4"/><text class="th" x="266.5" y="525" text-anchor="middle">pretokenize</text><text class="ts" x="266.5" y="541" text-anchor="middle">K · split patterns</text></g>
<g class="gray"><rect x="346" y="506" width="135" height="44" rx="4"/><text class="th" x="413.5" y="525" text-anchor="middle">cache/prefix</text><text class="ts" x="413.5" y="541" text-anchor="middle">G · pure diff</text></g>
