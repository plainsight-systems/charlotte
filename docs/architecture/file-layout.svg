<g class="gray"><rect x="250" y="260" width="180" height="44" rx="4"/><text class="th" x="340" y="279" text-anchor="middle">recordings.js</text><text class="ts" x="340" y="295" text-anchor="middle">H · recordings for the search</text></g>
