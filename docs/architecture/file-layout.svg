<g class="gray gpu"><rect x="52" y="562" width="135" height="44" rx="4"/><text class="th" x="119.5" y="581" text-anchor="middle">kernels/*</text><text class="ts" x="119.5" y="597" text-anchor="middle">E · per kernel</text></g>
<g class="gray"><rect x="199" y="562" width="135" height="44" rx="4"/><text class="th" x="266.5" y="581" text-anchor="middle">graph/</text><text class="ts" x="266.5" y="597" text-anchor="middle">A · shared blocks</text></g>
<g class="gray"><rect x="346" y="562" width="135" height="44" rx="4"/><text class="th" x="413.5" y="581" text-anchor="middle">sampler/</text><text class="ts" x="413.5" y="597" text-anchor="middle">F · top-k candidates</text></g>
<g class="gray"><rect x="493" y="562" width="135" height="44" rx="4"/><text class="th" x="560.5" y="581" text-anchor="middle">runtime/</text><text class="ts" x="560.5" y="597" text-anchor="middle">M · the turn loop</text></g>
<line class="arr" x1="340" y1="618" x2="340" y2="638" marker-end="url(#a)"/>
