name: test

on:
  push:
  pull_request:

jobs:
  native:
    name: Native build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Structural invariants
        run: ./tools/check_boundaries.sh

      - name: Guards fire when violated
        run: ./tests/test_check_boundaries.sh


      - name: Cache fetched test data
        uses: actions/cache@v4
        with:
          path: .cache/test-data
          key: test-data-${{ hashFiles('tests/fixtures/external.json', 'tests/fixtures/tokenizer/manifest.json') }}

      - name: Fetch test data
        run: python3 tools/fetch_test_data.py

      - name: Cache native Dawn
        uses: actions/cache@v4
        with:
          path: .cache/dawn
          key: dawn-${{ runner.os }}-${{ hashFiles('cmake/dawn.json') }}

      - name: Fetch native Dawn
        run: python3 tools/fetch_dawn.py

      # The runners have no GPU: the GPU tests run on Mesa's software Vulkan
      # driver (lavapipe), which Dawn's Vulkan backend finds like any adapter.
      - name: Install a software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1

      - name: Configure
        run: cmake --preset native-release

      - name: Build
        run: cmake --build --preset native-release

      - name: Test
        run: ctest --preset native-release -E '^charlotte_gpu_tests$'

      - name: GPU smoke
        run: ./tools/gpu_smoke.sh native-release

      # Names the adapter the GPU tests ran on, so a green run shows it was a
      # real device (lavapipe here), not a pass with nothing behind it.
      - name: GPU adapter used
        run: ./build/native-release/tests/gpu/charlotte_gpu_tests -s -tc="a device is acquired*" | grep "adapter:"

  sanitize:
    # AddressSanitizer catches what tests can survive by luck: a write past a
    # buffer, a reversed range handed to an algorithm, a use after free. It
    # runs here, on Linux; its runtime hangs at start-up on current macOS.
    name: Native unit tests under AddressSanitizer and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache fetched test data
        uses: actions/cache@v4
        with:
          path: .cache/test-data
          key: test-data-${{ hashFiles('tests/fixtures/external.json', 'tests/fixtures/tokenizer/manifest.json') }}

      - name: Fetch test data
        run: python3 tools/fetch_test_data.py

      - name: Cache native Dawn
        uses: actions/cache@v4
        with:
          path: .cache/dawn
          key: dawn-${{ runner.os }}-${{ hashFiles('cmake/dawn.json') }}

      - name: Fetch native Dawn
        run: python3 tools/fetch_dawn.py

      # The runners have no GPU: the GPU tests run on Mesa's software Vulkan
      # driver (lavapipe), which Dawn's Vulkan backend finds like any adapter.
      - name: Install a software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1

      - name: Configure
        run: cmake --preset native-sanitize

      - name: Build
        run: cmake --build --preset native-sanitize

      - name: Test
        run: ctest --preset native-sanitize -E '^charlotte_gpu_tests$'

      - name: GPU smoke
        run: ./tools/gpu_smoke.sh native-sanitize

      # Names the adapter the GPU tests ran on, so a green run shows it was a
      # real device (lavapipe here), not a pass with nothing behind it.
      - name: GPU adapter used
        run: ./build/native-sanitize/tests/gpu/charlotte_gpu_tests -s -tc="a device is acquired*" | grep "adapter:"

  web:
    name: JavaScript unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The template test reads each model's chat template from its pinned
      # header rather than a committed copy.
      - name: Cache fetched test data
        uses: actions/cache@v4
        with:
          path: .cache/test-data
          key: test-data-${{ hashFiles('tests/fixtures/external.json', 'tests/fixtures/tokenizer/manifest.json') }}

      - name: Fetch test data
        run: python3 tools/fetch_test_data.py

      - name: Test
        run: node --test tests/web/*.test.js
