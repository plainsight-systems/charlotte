<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charlotte</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<p id="fake-banner" class="fake-banner" hidden>
  Fake runtime: no model runs on this page. It exists to exercise the interface during development.
</p>
<header class="bar">
  <button id="menu" class="menu-button" type="button" aria-label="Models" aria-controls="side" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="brand">
    <svg class="spider" viewBox="0 0 24 40" width="24" height="40" aria-hidden="true">
      <line class="thread" x1="12" y1="0" x2="12" y2="18"/>
      <g class="legs">
        <path d="M10.6 21.5 Q6.5 18 4.5 13.5"/><path d="M10.2 23.5 Q5.5 22.5 2.5 20"/>
        <path d="M10.2 26 Q5.5 27.5 3 31.5"/><path d="M10.8 28.5 Q7.5 32.5 6 37"/>
        <path d="M13.4 21.5 Q17.5 18 19.5 13.5"/><path d="M13.8 23.5 Q18.5 22.5 21.5 20"/>
        <path d="M13.8 26 Q18.5 27.5 21 31.5"/><path d="M13.2 28.5 Q16.5 32.5 18 37"/>
      </g>
      <circle class="body" cx="12" cy="21" r="2.3"/>
      <ellipse class="body" cx="12" cy="27.5" rx="3.8" ry="4.8"/>
    </svg>
    <h1>Charlotte</h1>
  </div>
  <span id="device-status" class="device" data-state="pending"></span>
</header>
<section id="platform-notice" class="platform-notice" role="note" hidden></section>
<section id="diagnostics" class="diagnostics" aria-live="polite" hidden></section>
<div class="layout">
  <aside id="side" class="panel side" aria-label="Models" tabindex="-1">
    <div class="side-head">
      <h2>Models</h2>
      <button id="drawer-close" class="drawer-close" type="button" aria-label="Close models">×</button>
    </div>
    <div id="models"></div>
    <div id="model" class="model-panel" aria-live="polite"></div>
    <section id="cache" class="cache" aria-label="Downloaded models"></section>
  </aside>
  <main id="chat" class="panel chat" aria-label="Chat"></main>
</div>
<div id="scrim" class="scrim" hidden></div>
<footer class="foot">
  Runs entirely in your browser. Model files are downloaded from Hugging Face
  and cached on this device.
  <a href="https://github.com/plainsight-systems/charlotte">Source</a>
</footer>
<script type="module" src="./app.js"></script>
</body>
</html>
