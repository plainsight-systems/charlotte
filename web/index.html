  <div class="brand">
    <svg class="spider" viewBox="0 0 24 40" width="24" height="40" aria-hidden="true">
      <line class="thread" x1="12" y1="0" x2="12" y2="18"/>

<div class="layout">
  <aside id="side" class="panel side" aria-label="Models" tabindex="-1">
    <div class="side-head">
      <h2>Models</h2>
      <button id="drawer-close" class="drawer-close" type="button" aria-label="Close models">×</button>
    </div>
    <div id="models"></div>
    <div id="model" class="model-panel" aria-live="polite"></div>
    <section id="cache" class="cache" aria-label="Downloaded models"></section>
  </aside>
  <main id="chat" class="panel chat" aria-label="Chat"></main>
  <main id="search" class="panel chat" aria-label="Search" hidden></main>
</div>
<div id="scrim" class="scrim" hidden></div>
<footer class="foot">
